<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Petalawati{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased">

  <!-- Nav -->
  <nav class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 font-bold text-lg tracking-tight">
        <span class="text-violet-400">&#9670;</span>
        <span class="text-white">Petalawati</span>
        <span class="text-gray-500 text-sm font-normal">CNN Trainer</span>
      </a>
      <div class="flex items-center gap-6 text-sm">
        <a href="/" class="text-gray-400 hover:text-white transition">Dashboard</a>
        <a href="/catalogue" class="text-gray-400 hover:text-white transition">Catalogue</a>
        <a href="/upload"
           class="bg-violet-600 hover:bg-violet-500 text-white px-4 py-1.5 rounded-lg transition font-medium">
          + New Job
        </a>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <main class="max-w-6xl mx-auto px-4 py-10">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
