# fly.toml file configured for your application
app = "petalawati"    # Replace with your app name
primary_region = "sin"   # Or your chosen region

[build]
  dockerfile = "Dockerfile"

# This section is updated to meet your new requirements.
# We are selecting a 'performance' machine with 4 CPUs and 4GB of RAM.
[vm]
  cpu_kind = "performance"
  cpus = 4
  memory_mb = 4096 # 4GB of RAM

# This is the corrected services section.
# It handles both HTTP and WebSocket traffic.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # This port handles standard HTTP traffic and redirects to HTTPS
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  # This port handles secure TLS and HTTP traffic
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # Concurrency settings for handling connections
  [services.concurrency]
    type = "connections"
    hard_limit = 200 # Adjust as needed
    soft_limit = 150 # Adjust as needed